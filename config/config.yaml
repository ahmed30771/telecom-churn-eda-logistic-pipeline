# =========================================
# Data Configuration ✔
# =========================================

data:
  data_path: data/telco_customer_churn.csv
  index_column: "customerID"   # write false if no index column

# =========================================
# Model Configuration
# =========================================

model:
  logistic_regression:
    save_path: model/churn_model.pkl
    random_state: 42


# =========================================
# Report Configuration
# =========================================
report:
  cv_report_path: reports/cv_report.csv


# =========================================
# Target Configuration ✔
# =========================================

target:
  column: Churn


# =========================================
# Train Test Split ✔
# =========================================

split:
  test_size: 0.2
  random_state: 42
  stratify_target: true


# =========================================
# Columns Transformer ✔
# =========================================

column_transformer:
  numeric:
    features:
      - tenure
      - TotalCharges
      - MonthlyCharges
    SimpleImputer:
      strategy: median

  nominal:
    features:
      - MultipleLines
      - InternetService
      - OnlineSecurity
      - OnlineBackup
      - DeviceProtection
      - TechSupport
      - StreamingTV
      - StreamingMovies
      - PaymentMethod
    SimpleImputer:
      strategy: most_frequent
    OneHotEncoder:
      handle_unknown: ignore
      drop: first

  ordinal:
    features:  # features with ordered values
      Contract:
          - Month-to-month
          - One year
          - Two year
      gender:
          - Female
          - Male
      Partner:
          - 'No'
          - 'Yes'
      Dependents:
          - 'No'
          - 'Yes'
      PhoneService:
          - 'No'
          - 'Yes'
      PaperlessBilling:
          - 'No'
          - 'Yes'
    SimpleImputer: 
      strategy: most_frequent



# =========================================
# Grid Search Configuration ✔
# =========================================

grid_search:
  cv: 5
  scoring: accuracy
  n_jobs: -1
  verbose: 2
  param_grid:
    model__C:
      - 0.01
      - 0.1
      - 1
      - 10
    model__solver:
      - lbfgs
      - liblinear
    model__max_iter:
      - 100
      - 200
      - 500
      - 5000


